<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>LegalSangam</title>
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('legalsangam-theme') === 'dark' || 
            (!('legalsangam-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          document.documentElement.classList.add('preload');
          window.addEventListener('load', function() {
            setTimeout(function() { document.documentElement.classList.remove('preload'); }, 50);
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
<div id="app"></div>
<script type="module" src="/src/main.tsx"></script>
  </body>
</html>
